<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PumpkinPi</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1>PumpkinPi</h1>
  <span class="mode" id="modeBadge">Demo</span>
  <button class="stop" id="stopBtn" type="button" aria-label="Emergency stop">STOP</button>
</header>

<form id="askForm" class="ask" autocomplete="off">
  <input id="prompt" name="prompt" type="text" inputmode="none" placeholder="What should we pipe on the pie?" aria-label="What should we pipe on the pie?" required>
  <button type="submit" class="btn primary" id="askBtn">Ask</button>
</form>

<section class="result" id="result" hidden aria-live="polite">
  <svg id="preview" class="preview" viewBox="-60 -60 120 120" role="img" aria-label="Piping preview">
    <circle r="58" class="crust"/><circle r="50" class="filling"/><circle r="45" class="safe"/>
    <g id="strokes"></g>
  </svg>
  <div class="side">
    <div id="plan" class="plan"></div>
    <div class="gate">
      <span class="g"><span class="dot" id="gDesign"></span>Design</span>
      <span class="g"><span class="dot" id="gSafe"></span><span id="safeText">Ingredients</span></span>
      <span class="g"><span class="dot" id="gReady"></span><span id="readyText">Pie ready</span></span>
    </div>
    <div class="row">
      <button class="btn" id="readyBtn" type="button">Camera</button>
      <button class="btn" id="dryBtn" type="button" disabled>Dry run</button>
      <button class="btn go" id="startBtn" type="button" disabled>Start</button>
    </div>
    <div class="meter" aria-hidden="true"><div class="fill" id="jobFill"></div></div>
  </div>
</section>

<div class="kbd" id="kbd" hidden aria-label="On-screen keyboard"></div>
<footer class="log" id="log" aria-live="polite"></footer>
<script src="app.js"></script>
</body>
</html>
