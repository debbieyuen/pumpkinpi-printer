<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PumpkinPi</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 7c-1-3 1-5 3-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="11" cy="18" rx="7" ry="10" fill="currentColor" opacity=".75"/><ellipse cx="21" cy="18" rx="7" ry="10" fill="currentColor" opacity=".75"/><ellipse cx="16" cy="18" rx="6" ry="11" fill="currentColor"/></svg>
    <div>
      <h1>PumpkinPi</h1>
      <p class="sub" id="eventName">Thanksgiving with family</p>
    </div>
  </div>
  <div class="mode" id="modeBadge" title="Connection">Demo mode</div>
</header>

<main class="grid">
  <section class="panel check" aria-labelledby="checkTitle">
    <h2 id="checkTitle"><span class="step">1</span> Check every ingredient</h2>
    <form id="checkForm" class="checkform" autocomplete="off">
      <input id="product" name="product" type="text" placeholder="Scan or type a product" aria-label="Product name" required>
      <button type="submit" class="btn primary" id="checkBtn">Check</button>
    </form>
    <div class="chips" id="chips" aria-label="Try a product"></div>

    <div id="results" class="results" aria-live="polite">
      <div class="empty">
        <p>Nothing checked yet.</p>
        <p class="muted">Perplexity searches labels and recalls for each guest's allergens before the printer can start.</p>
      </div>
    </div>
  </section>

  <section class="panel print" aria-labelledby="printTitle">
    <h2 id="printTitle"><span class="step">2</span> Decorate</h2>

    <label class="field">
      <span>Pipe a name for</span>
      <select id="guest"></select>
    </label>

    <div class="gate" id="gate">
      <div class="gate-row"><span class="dot" id="gSafe"></span><span>All ingredients green</span></div>
      <div class="gate-row"><span class="dot" id="gReady"></span><span id="readyText">Pie centered and ready</span></div>
    </div>

    <div class="meter" aria-hidden="true"><div class="fill" id="readyFill"></div></div>
    <div class="row">
      <button class="btn ghost" id="readyBtn" type="button">Check pie with camera</button>
      <button class="btn go" id="startBtn" type="button" disabled>Start piping</button>
    </div>

    <button class="stop" id="stopBtn" type="button" aria-label="Emergency stop">STOP</button>
  </section>
</main>

<footer class="log" id="log" aria-live="polite"></footer>
<script src="app.js"></script>
</body>
</html>
